name: 部署到 GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  pages: read
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验题库
        run: python3 tools/bank_tool.py validate

      - name: 生成题库清单
        run: python3 tools/bank_tool.py build

      - name: 回写题库清单
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/; then
            git add data/
            git commit -m "chore: 自动更新题库清单 [skip ci]"
            git push
          else
            echo "题库清单无变化"
          fi

      - name: 整理站点文件
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js data icons _site/

      - name: 检查 Pages 是否已启用
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          if [ "$code" != "200" ]; then
            echo "::error title=GitHub Pages 尚未启用::请到仓库的 Settings → Pages，把 Build and deployment 下的 Source 改成「GitHub Actions」，然后重新运行本工作流。"
            exit 1
          fi
          echo "Pages 已启用，继续部署"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
